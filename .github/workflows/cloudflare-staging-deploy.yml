name: Deploy Cloudflare staging

on:
  push:
    branches:
      - main
      - qa/launch-readiness-hardening-20260923
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Public client configuration needed at build time.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CLOUDFLARE_STAGING_NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CLOUDFLARE_STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Checkout receives the active public Razorpay key from the server at runtime.
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_build_check
      NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.CLOUDFLARE_STAGING_NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY }}
      NEXT_PUBLIC_SUPPORT_WHATSAPP_UI_ENABLED: 'false'

      # Build-only placeholders. Real server secrets must already exist as
      # encrypted Cloudflare Worker secrets before this workflow is run.
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
      RAZORPAY_KEY_ID: build-only-placeholder
      RAZORPAY_KEY_SECRET: build-only-placeholder
      RAZORPAY_WEBHOOK_SECRET: build-only-placeholder
      GOOGLE_MAPS_ROUTES_API_KEY: build-only-placeholder
      PLANAPI_MEMBER_ID: build-only-placeholder
      PLANAPI_PASSWORD: build-only-placeholder
      PLANAPI_TOKEN_ID: build-only-placeholder
      SUPPORT_AI_ENABLED: 'false'
      ENFORCE_JAGTIAL_SERVICE_AREA: 'false'
      SUPPORT_WHATSAPP_SENDER_ENABLED: 'false'
      PAYMENT_ROUTER_MODE: 'off'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify Cloudflare authentication and client build configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub secret for $key"
              exit 1
            fi
          done

      - run: npm ci

      - name: Build Cloudflare Worker
        run: npx --yes @opennextjs/cloudflare@1.20.6 build

      - name: Deploy only to workers.dev staging
        run: npx --yes wrangler@4.68.0 deploy --config wrangler.jsonc --name zeshu-web-staging

      - name: Verify staging runtime safety and payment sandbox readiness
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = 'https://zeshu-web-staging.asif-mohammed0127.workers.dev/api/staging/qa-health';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          let body = null;
          let lastError = null;
          for (let attempt = 1; attempt <= 10; attempt += 1) {
            try {
              const response = await fetch(url, {
                headers: { 'cache-control': 'no-cache' },
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              body = await response.json();
              break;
            } catch (error) {
              lastError = error;
              if (attempt < 10) await sleep(3000);
            }
          }

          if (!body) throw lastError || new Error('Staging health endpoint did not respond.');

          const runtime = body.runtime || {};
          const checks = {
            staging_supabase_url_present: runtime.staging_supabase_url_present === true,
            staging_supabase_url_matches: runtime.staging_supabase_url_matches === true,
            anon_key_present: runtime.anon_key_present === true,
            service_secret_present: runtime.service_secret_present === true,
            payment_router_off: runtime.payment_router_off === true,
            whatsapp_sender_off: runtime.whatsapp_sender_off === true,
            razorpay_real_test_configured: runtime.razorpay_real_test_configured === true,
            phonepe_sandbox_configured: runtime.phonepe_sandbox_configured === true,
          };

          const required = ['staging_supabase_url_present','staging_supabase_url_matches','anon_key_present','service_secret_present','payment_router_off','whatsapp_sender_off','razorpay_real_test_configured'];
          const failed = required.filter((name) => checks[name] !== true);
          console.log('Staging runtime checks:', checks);
          if (failed.length) {
            throw new Error(`Staging runtime verification failed: ${failed.join(', ')}`);
          }
          NODE


      - name: Smoke test staging customer routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://zeshu-web-staging.asif-mohammed0127.workers.dev"
          for route in "/" "/policies" "/partners" "/app" "/scanner" "/help" "/move"; do
            code="$(curl -L -sS -o /tmp/zeshu-staging-body -w '%{http_code}' "$base$route" || true)"
            if [ "$code" != "200" ]; then
              echo "Expected 200 from staging $route, got $code"
              exit 1
            fi
          done

      - name: Verify Jagtial service-area API boundaries
        shell: bash
        run: |
          set -euo pipefail
          base="https://zeshu-web-staging.asif-mohammed0127.workers.dev"

          code="$(curl -sS -o /tmp/service-area-jagtial -w '%{http_code}' \
            -X POST "$base/api/service-area/check" \
            -H 'Content-Type: application/json' \
            --data '{"latitude":18.80,"longitude":78.93}' || true)"
          test "$code" = "200" || { echo "Jagtial service-area check expected 200, got $code"; cat /tmp/service-area-jagtial; exit 1; }

          code="$(curl -sS -o /tmp/service-area-outside -w '%{http_code}' \
            -X POST "$base/api/service-area/check" \
            -H 'Content-Type: application/json' \
            --data '{"latitude":17.385,"longitude":78.4867}' || true)"
          test "$code" = "200" || { echo "Outside service-area check expected 200, got $code"; cat /tmp/service-area-outside; exit 1; }

          code="$(curl -sS -o /tmp/service-area-invalid -w '%{http_code}' \
            -X POST "$base/api/service-area/check" \
            -H 'Content-Type: application/json' \
            --data '{"latitude":91,"longitude":0}' || true)"
          test "$code" = "400" || { echo "Invalid service-area check expected 400, got $code"; cat /tmp/service-area-invalid; exit 1; }

          node <<'NODE'
          const fs = require('fs');
          const jagtial = JSON.parse(fs.readFileSync('/tmp/service-area-jagtial', 'utf8'));
          const outside = JSON.parse(fs.readFileSync('/tmp/service-area-outside', 'utf8'));
          const invalid = JSON.parse(fs.readFileSync('/tmp/service-area-invalid', 'utf8'));

          if (jagtial.status !== 'ELIGIBLE' || jagtial.serviceable !== true) throw new Error('Jagtial center must be eligible');
          if (outside.status !== 'OUTSIDE_SERVICE_AREA' || outside.serviceable !== false) throw new Error('Outside-city point must not be serviceable');
          if (invalid.status !== 'SERVICE_AREA_UNAVAILABLE' || invalid.serviceable !== false) throw new Error('Invalid coordinates must fail closed');
          NODE

      - name: Verify staging support readiness and auth boundaries
        shell: bash
        run: |
          set -euo pipefail
          base="https://zeshu-web-staging.asif-mohammed0127.workers.dev"

          body="$(curl -L -sS "$base/api/support/assistant")"
          echo "Assistant readiness: $body"
          echo "$body" | grep -Eq '"mode":"(ai|guided)"' || { echo "Assistant readiness mode missing"; exit 1; }
          echo "$body" | grep -q '"automatic_handoff":true' || { echo "Automatic support handoff is not configured"; exit 1; }

          code="$(curl -L -sS -o /tmp/assistant -w '%{http_code}' \
            -X POST "$base/api/support/assistant" \
            -H 'Content-Type: application/json' \
            --data '{"message":"Can I book a bike ride now?"}' || true)"
          test "$code" = "200" || { echo "Public assistant expected 200, got $code"; cat /tmp/assistant; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/assistant', 'utf8'));
          if (payload.signed_in !== false) throw new Error('Public assistant must report signed_in=false');
          if (payload.resolved !== true) throw new Error('Public ride availability question should be resolved without human handoff');
          if (!['RIDES','GENERAL'].includes(String(payload.intent || '').toUpperCase())) throw new Error('Unexpected public assistant intent');
          const used = Array.isArray(payload.context_used) ? payload.context_used : [];
          if (used.includes('orders') || used.includes('rewards')) throw new Error('Guest assistant leaked private account context');
          if (payload?.handoff?.created) throw new Error('Guest assistant must not create a private support conversation');
          NODE

          code="$(curl -L -sS -o /tmp/move-readiness -w '%{http_code}' "$base/api/move/readiness" || true)"
          test "$code" = "200" || { echo "Move readiness expected 200, got $code"; cat /tmp/move-readiness; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/move-readiness', 'utf8'));
          if (payload.customer_booking_enabled !== false) throw new Error('Move & Travel customer booking must remain disabled');
          const services = payload.services || {};
          for (const key of ['rides','courier','car_share','travel']) {
            if (!services[key]) throw new Error(`Missing Move & Travel readiness for ${key}`);
            if (services[key].customerBookingAvailable !== false) throw new Error(`${key} unexpectedly became bookable`);
          }
          NODE

          code="$(curl -L -sS -o /tmp/support-conversations -w '%{http_code}' \
            "$base/api/support/conversations" || true)"
          test "$code" = "401" || { echo "Customer support conversations expected 401 for guest, got $code"; exit 1; }

          code="$(curl -L -sS -o /tmp/admin-support -w '%{http_code}' \
            "$base/api/admin/support/conversations" || true)"
          test "$code" = "401" || { echo "Admin support expected 401, got $code"; exit 1; }

          code="$(curl -L -sS -o /tmp/whatsapp-readiness -w '%{http_code}' \
            "$base/api/admin/support/whatsapp-readiness" || true)"
          test "$code" = "401" || { echo "WhatsApp readiness expected 401, got $code"; exit 1; }

          code="$(curl -L -sS -o /tmp/cron -w '%{http_code}' \
            "$base/api/cron/support-whatsapp" || true)"
          test "$code" = "401" || { echo "WhatsApp cron expected 401 without bearer token, got $code"; exit 1; }

      - name: Verify launch-readiness customer flows on feature branch
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = 'https://zeshu-web-staging.asif-mohammed0127.workers.dev';
          const browser = await chromium.launch({ headless: true });
          const assert = (value, message) => { if (!value) throw new Error(message); };

          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const paymentRequests = [];
            page.on('request', (request) => {
              if (/\/api\/(create-razorpay-order|verify-payment)/.test(request.url())) paymentRequests.push(request.url());
            });

            await page.goto(base, { waitUntil: 'networkidle', timeout: 60000 });
            await page.evaluate(() => localStorage.removeItem('zeshu_customer_cart'));
            await page.reload({ waitUntil: 'networkidle', timeout: 60000 });

            const filtersButton = page.getByRole('button', { name: 'Filters', exact: true }).first();
            await filtersButton.click();
            const filterPanel = page.locator('#product-filters');
            await filterPanel.waitFor({ state: 'visible', timeout: 10000 });
            const selects = filterPanel.locator('select');
            assert(await selects.count() >= 6, 'Expected catalog filters are missing');
            await selects.nth(2).selectOption('UNDER_100');
            await selects.nth(3).selectOption('AVAILABLE');
            await selects.nth(5).selectOption('price_asc');
            assert(await selects.nth(2).inputValue() === 'UNDER_100', 'Price filter did not apply');
            assert(await selects.nth(3).inputValue() === 'AVAILABLE', 'Availability filter did not apply');
            assert(await selects.nth(5).inputValue() === 'price_asc', 'Sort did not apply');
            await page.getByRole('button', { name: 'Clear all', exact: true }).click();

            const addButton = page.locator('#products').getByRole('button', { name: 'ADD', exact: true }).first();
            await addButton.waitFor({ state: 'visible', timeout: 10000 });
            await addButton.click();
            const cartState = await page.evaluate(() => JSON.parse(localStorage.getItem('zeshu_customer_cart') || '[]'));
            assert(Array.isArray(cartState) && cartState.length > 0, 'ADD did not update cart');

            const cartButton = page.locator('button[aria-label^="Open cart"]').first();
            await cartButton.click();
            const cart = page.getByRole('dialog');
            await cart.waitFor({ state: 'visible', timeout: 10000 });
            const cartText = (await cart.innerText()).replace(/\s+/g, ' ');
            assert(cartText.includes('Price Details'), 'Cart price breakdown missing');
            assert(cartText.includes('No hidden fees'), 'Transparent pricing message missing');
            assert(cartText.includes('Proceed to secure payment'), 'Secure checkout CTA missing');
            assert(paymentRequests.length === 0, 'Payment API called during non-payment cart smoke');
            await page.getByRole('button', { name: 'Close cart' }).click();

            await page.goto(base + '/?view=services', { waitUntil: 'networkidle', timeout: 60000 });
            const servicesText = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            for (const label of ['Prepaid','Electricity','DTH','UPI Tools · Soon','Pharmacy','FASTag','Gas Booking','Piped Gas','Water Bill','Broadband']) {
              assert(servicesText.includes(label), `Digital service tab missing: ${label}`);
            }

            await page.getByRole('button', { name: 'Electricity', exact: true }).click();
            const fetchBill = page.getByRole('button', { name: 'Fetch Bill', exact: true });
            await fetchBill.waitFor({ state: 'visible', timeout: 10000 });
            assert(await fetchBill.isDisabled(), 'Electricity flow advanced without provider');

            await page.getByRole('button', { name: 'FASTag', exact: true }).click();
            const fastagCheck = page.getByRole('button', { name: 'Check FASTag details', exact: true });
            await fastagCheck.waitFor({ state: 'visible', timeout: 10000 });
            assert(await fastagCheck.isDisabled(), 'FASTag flow advanced without provider');

            await page.getByRole('button', { name: 'Pharmacy', exact: true }).click();
            let text = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            assert(text.includes('No medicine payment or prescription transaction is available'), 'Pharmacy safety gate missing');

            await page.getByRole('button', { name: 'UPI Tools · Soon', exact: true }).click();
            text = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            assert(text.includes('No payment can be started from this screen'), 'UPI safety gate missing');
            assert(paymentRequests.length === 0, 'Payment API called during utility discovery');

            console.log('LAUNCH_READINESS_FEATURE_BRANCH_QA=PASS');
          } finally {
            await browser.close();
          }
          NODE

      - name: Staging deployment summary
        run: echo "Cloudflare staging deploy, runtime safety, Razorpay TEST readiness, customer routes, and auth-boundary smoke checks passed."
