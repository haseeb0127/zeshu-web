name: Deploy marketplace foundation to Cloudflare staging

on:
  push:
    branches:
      - feat/delivery-rider-mobility-support-20260924
    paths:
      - ".github/workflows/cloudflare-marketplace-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Public client configuration needed at build time.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CLOUDFLARE_STAGING_NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CLOUDFLARE_STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Checkout receives the active public Razorpay key from the server at runtime.
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_build_check
      NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.CLOUDFLARE_STAGING_NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY }}
      NEXT_PUBLIC_SUPPORT_WHATSAPP_UI_ENABLED: 'false'

      # Build-only placeholders. Real server secrets must already exist as
      # encrypted Cloudflare Worker secrets before this workflow is run.
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
      RAZORPAY_KEY_ID: build-only-placeholder
      RAZORPAY_KEY_SECRET: build-only-placeholder
      RAZORPAY_WEBHOOK_SECRET: build-only-placeholder
      GOOGLE_MAPS_ROUTES_API_KEY: build-only-placeholder
      PLANAPI_MEMBER_ID: build-only-placeholder
      PLANAPI_PASSWORD: build-only-placeholder
      PLANAPI_TOKEN_ID: build-only-placeholder
      SUPPORT_AI_ENABLED: 'false'
      ENFORCE_JAGTIAL_SERVICE_AREA: 'false'
      SUPPORT_WHATSAPP_SENDER_ENABLED: 'false'
      PAYMENT_ROUTER_MODE: 'off'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify Cloudflare authentication and client build configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub secret for $key"
              exit 1
            fi
          done

      - run: npm ci

      - name: Build Cloudflare Worker
        run: npx --yes @opennextjs/cloudflare@1.20.6 build

      - name: Deploy only to workers.dev staging
        run: npx --yes wrangler@4.68.0 deploy --config wrangler.jsonc --name zeshu-web-staging

      - name: Verify staging runtime safety and payment sandbox readiness
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = 'https://zeshu-web-staging.asif-mohammed0127.workers.dev/api/staging/qa-health';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          let body = null;
          let lastError = null;
          for (let attempt = 1; attempt <= 10; attempt += 1) {
            try {
              const response = await fetch(url, {
                headers: { 'cache-control': 'no-cache' },
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              body = await response.json();
              break;
            } catch (error) {
              lastError = error;
              if (attempt < 10) await sleep(3000);
            }
          }

          if (!body) throw lastError || new Error('Staging health endpoint did not respond.');

          const runtime = body.runtime || {};
          const checks = {
            staging_supabase_url_present: runtime.staging_supabase_url_present === true,
            staging_supabase_url_matches: runtime.staging_supabase_url_matches === true,
            anon_key_present: runtime.anon_key_present === true,
            service_secret_present: runtime.service_secret_present === true,
            payment_router_off: runtime.payment_router_off === true,
            whatsapp_sender_off: runtime.whatsapp_sender_off === true,
            razorpay_real_test_configured: runtime.razorpay_real_test_configured === true,
            phonepe_sandbox_configured: runtime.phonepe_sandbox_configured === true,
          };

          const required = ['staging_supabase_url_present','staging_supabase_url_matches','anon_key_present','service_secret_present','payment_router_off','whatsapp_sender_off','razorpay_real_test_configured'];
          const failed = required.filter((name) => checks[name] !== true);
          console.log('Staging runtime checks:', checks);
          if (failed.length) {
            throw new Error(`Staging runtime verification failed: ${failed.join(', ')}`);
          }
          NODE


      - name: Smoke test staging customer routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://zeshu-web-staging.asif-mohammed0127.workers.dev"
          for route in "/" "/policies" "/partners" "/app" "/scanner"; do
            code="$(curl -L -sS -o /tmp/zeshu-staging-body -w '%{http_code}' "$base$route" || true)"
            if [ "$code" != "200" ]; then
              echo "Expected 200 from staging $route, got $code"
              exit 1
            fi
          done

      - name: Verify staging support readiness and auth boundaries
        shell: bash
        run: |
          set -euo pipefail
          base="https://zeshu-web-staging.asif-mohammed0127.workers.dev"

          body="$(curl -L -sS "$base/api/support/assistant")"
          echo "Assistant readiness: $body"
          echo "$body" | grep -Eq '"mode":"(ai|guided)"' || { echo "Assistant readiness mode missing"; exit 1; }
          echo "$body" | grep -q '"automatic_handoff":true' || { echo "Automatic support handoff is not configured"; exit 1; }

          code="$(curl -L -sS -o /tmp/assistant -w '%{http_code}' \
            -X POST "$base/api/support/assistant" \
            -H 'Content-Type: application/json' \
            --data '{"message":"hello"}' || true)"
          test "$code" = "401" || { echo "Assistant expected 401, got $code"; exit 1; }

          code="$(curl -L -sS -o /tmp/admin-support -w '%{http_code}' \
            "$base/api/admin/support/conversations" || true)"
          test "$code" = "401" || { echo "Admin support expected 401, got $code"; exit 1; }

          code="$(curl -L -sS -o /tmp/whatsapp-readiness -w '%{http_code}' \
            "$base/api/admin/support/whatsapp-readiness" || true)"
          test "$code" = "401" || { echo "WhatsApp readiness expected 401, got $code"; exit 1; }

          code="$(curl -L -sS -o /tmp/cron -w '%{http_code}' \
            "$base/api/cron/support-whatsapp" || true)"
          test "$code" = "401" || { echo "WhatsApp cron expected 401 without bearer token, got $code"; exit 1; }

      - name: Verify marketplace storefront and seller trust
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base = 'https://zeshu-web-staging.asif-mohammed0127.workers.dev';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          try {
            const sellers = await page.request.get(base + '/api/marketplace/sellers');
            assert(sellers.ok(), 'Marketplace seller API failed');
            const sellerPayload = await sellers.json();
            assert(Array.isArray(sellerPayload.sellers), 'Seller API payload invalid');
            const seller = sellerPayload.sellers.find((entry) => entry.business_name === 'Zeshu Staging Store');
            assert(seller?.marketplace_status === 'VERIFIED', 'Verified staging seller not returned');
            assert(seller?.kyc_verified === true, 'Verified seller KYC flag missing');
            assert(!Object.prototype.hasOwnProperty.call(seller || {}, 'seller_quality_score'), 'Internal seller quality score leaked to customer API');
            assert(!Object.prototype.hasOwnProperty.call(seller || {}, 'owner_id'), 'Seller owner id leaked to customer API');

            await page.goto(base, { waitUntil: 'networkidle', timeout: 60000 });
            const body = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            assert(body.includes('Verified Seller'), 'Verified Seller badge not visible');
            assert(body.includes('Sold by Zeshu Staging Store'), 'Seller name not visible on product card');
            assert(body.includes('Today') || body.includes('10–30 min'), 'Customer delivery promise not visible');

            const search = page.locator('input[aria-label="Search Zeshu"]');
            await search.fill('doodh');
            await page.waitForTimeout(900);
            const searchBody = (await page.locator('body').innerText()).toLowerCase();
            assert(searchBody.includes('milk'), 'Intent-aware search regressed after marketplace ranking');

            await search.fill('');
            await page.waitForTimeout(500);
            const seeded = await page.evaluate(() => {
              const products = JSON.parse(localStorage.getItem('zeshu_products') || '[]');
              const product = products.find((entry) => entry?.vendor_id && entry?.in_stock !== false && Number(entry?.quantity) > 0);
              if (!product) return false;
              localStorage.setItem('zeshu_customer_cart', JSON.stringify([{ item: product, qty: 1 }]));
              return true;
            });
            assert(seeded, 'Could not seed a safe staging cart from the loaded catalog');

            await page.setViewportSize({ width: 1440, height: 900 });
            await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
            const cartButton = page.locator('button[aria-label^="Open cart"]').first();
            await cartButton.waitFor({ state: 'visible', timeout: 10000 });
            await cartButton.click();

            const cartDialog = page.getByRole('dialog');
            await cartDialog.waitFor({ state: 'visible', timeout: 10000 });
            const cartText = (await cartDialog.innerText()).replace(/\s+/g, ' ');
            assert(
              cartText.includes('Arriving today') || cartText.includes('Arriving in ~10–30 min') || cartText.includes('Shipped delivery · 2–4 days'),
              'Cart fulfillment grouping is missing',
            );

            console.log('MARKETPLACE_FOUNDATION_BROWSER_QA=PASS');
          } finally {
            await browser.close();
          }
          NODE

      - name: Verify Drive and Deliver onboarding safety
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = 'https://zeshu-web-staging.asif-mohammed0127.workers.dev';
          const browser = await chromium.launch({ headless: true });
          const assert = (value, message) => { if (!value) throw new Error(message); };

          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });

            const statusResponse = await page.request.get(base + '/api/partners/driver-interest/status');
            assert(statusResponse.ok(), 'Driver/rider readiness endpoint failed');
            const status = await statusResponse.json();
            assert(status.interest_registration_available === true, 'Interest registration should be available');
            assert(status.document_upload_available === false, 'Document upload must remain disabled');
            assert(status.activation_available === false, 'Driver/rider activation must remain disabled');
            for (const role of ['DELIVERY_RIDER','BIKE_COURIER','AUTO_DRIVER','CAB_DRIVER','GOODS_DRIVER','PASSENGER_FLEET_OPERATOR','LOGISTICS_FLEET_OPERATOR']) {
              assert(status.roles?.[role]?.activationAvailable === false, `Role unexpectedly activatable: ${role}`);
            }

            const honeypot = await page.request.post(base + '/api/partners/driver-interest', {
              data: { company_fax: 'bot-filled' },
              headers: { 'Content-Type': 'application/json' },
            });
            assert(honeypot.ok(), 'Driver interest honeypot path failed');

            await page.goto(base + '/earn', { waitUntil: 'networkidle', timeout: 60000 });
            let body = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            assert(body.includes('Drive & Deliver with Zeshu'), 'Drive & Deliver page heading missing');
            assert(body.includes('Privacy first'), 'Applicant privacy guidance missing');
            assert(body.includes('Register my interest'), 'Interest CTA missing');
            assert(body.includes('Passenger Fleet Operator'), 'Passenger fleet option missing');
            assert(body.includes('Courier / Cargo Fleet Operator'), 'Logistics fleet option missing');

            const allInputs = await page.locator('input, textarea, select').evaluateAll((nodes) =>
              nodes.map((node) => ({
                name: node.getAttribute('name') || '',
                placeholder: node.getAttribute('placeholder') || '',
                type: node.getAttribute('type') || '',
              }))
            );
            const serialized = JSON.stringify(allInputs).toLowerCase();
            for (const forbidden of ['aadhaar','aadhar','pan number','driving licence number','driving license number','dl number','rc number','bank account','upi pin']) {
              assert(!serialized.includes(forbidden), `Sensitive public field exposed: ${forbidden}`);
            }

            const actions = (await page.locator('button, a').allTextContents()).join(' ');
            assert(!/\bGo online\b|\bStart ride\b|\bStart delivery\b|\bAccept trip\b|\bAccept delivery\b/i.test(actions), 'Execution action exposed before activation');

            await page.evaluate(() => localStorage.setItem('zeshu.customer.language', 'te'));
            await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
            body = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            assert(body.includes('Zeshuతో డ్రైవ్ & డెలివర్ చేయండి'), 'Telugu onboarding heading missing');

            await page.evaluate(() => localStorage.setItem('zeshu.customer.language', 'hi'));
            await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
            body = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            assert(body.includes('Zeshu के साथ ड्राइव और डिलीवर करें'), 'Hindi onboarding heading missing');

            await page.evaluate(() => localStorage.setItem('zeshu.customer.language', 'ur'));
            await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dir === 'rtl', null, { timeout: 10000 });
            body = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            assert(body.includes('Zeshu کے ساتھ ڈرائیو اور ڈیلیور کریں'), 'Urdu onboarding heading missing');
            assert(await page.locator('html').getAttribute('dir') === 'rtl', 'Urdu onboarding page is not RTL');

            console.log('DRIVER_RIDER_STAGING_BROWSER_QA=PASS');
          } finally {
            await browser.close();
          }
          NODE

      - name: Staging deployment summary
        run: echo "Cloudflare staging deploy, marketplace regression, and Drive & Deliver privacy/readiness browser QA passed."
