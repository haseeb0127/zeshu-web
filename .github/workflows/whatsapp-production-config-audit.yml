name: WhatsApp production config audit

on:
  push:
    branches:
      - ops/whatsapp-readiness-audit-20260923
    paths:
      - ".github/workflows/whatsapp-production-config-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Audit production Worker binding presence only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          if (!accountId || !token) throw new Error('Cloudflare audit credentials are unavailable.');

          const script = 'zeshu-web-production-candidate';
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/scripts/${script}/settings`,
            { headers: { Authorization: `Bearer ${token}` } },
          );
          if (!response.ok) throw new Error(`Cloudflare settings audit failed with HTTP ${response.status}`);
          const payload = await response.json();
          if (!payload?.success || !payload?.result) throw new Error('Cloudflare settings audit did not return a successful result.');

          const bindings = Array.isArray(payload.result.bindings) ? payload.result.bindings : [];
          const present = new Map(bindings.map((binding) => [String(binding?.name || ''), String(binding?.type || 'unknown')]));
          const expected = [
            'SUPPORT_WHATSAPP_SENDER_ENABLED',
            'NEXT_PUBLIC_SUPPORT_WHATSAPP_UI_ENABLED',
            'CRON_SECRET',
            'WHATSAPP_ACCESS_TOKEN',
            'WHATSAPP_PHONE_NUMBER_ID',
            'WHATSAPP_GRAPH_API_VERSION',
            'WHATSAPP_SUPPORT_REPLY_TEMPLATE_NAME',
            'WHATSAPP_SUPPORT_REPLY_TEMPLATE_LANGUAGE',
            'WHATSAPP_SUPPORT_RESOLVED_TEMPLATE_NAME',
            'WHATSAPP_SUPPORT_RESOLVED_TEMPLATE_LANGUAGE',
            'WHATSAPP_WEBHOOK_VERIFY_TOKEN',
            'WHATSAPP_APP_SECRET',
          ];

          const result = Object.fromEntries(expected.map((name) => [
            name,
            { present: present.has(name), binding_type: present.get(name) || null },
          ]));

          console.log('WHATSAPP_PRODUCTION_BINDING_PRESENCE=' + JSON.stringify(result));
          console.log('No binding values were requested or printed.');
          NODE
