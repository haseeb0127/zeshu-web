name: Public DNS cutover audit

on:
  push:
    branches:
      - ops/cloudflare-cutover-20260922
    paths:
      - .github/workflows/public-dns-cutover-audit.yml

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install DNS tools
        run: |
          if ! command -v dig >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dnsutils
          fi

      - name: Resolve complete current public DNS
        shell: bash
        run: |
          set -euo pipefail

          q() {
            label="$1"
            type="$2"
            name="$3"
            echo "=== $label ==="
            dig +short "$type" "$name" || true
          }

          q 'NS' NS zeshu.in
          q 'DS / DNSSEC' DS zeshu.in
          q 'APEX A' A zeshu.in
          q 'APEX AAAA' AAAA zeshu.in
          q 'WWW CNAME' CNAME www.zeshu.in
          q 'WWW A' A www.zeshu.in
          q 'WWW AAAA' AAAA www.zeshu.in
          q 'API CNAME' CNAME api.zeshu.in
          q 'API A' A api.zeshu.in
          q 'API AAAA' AAAA api.zeshu.in
          q 'AUTODISCOVER CNAME' CNAME autodiscover.zeshu.in
          q 'AUTODISCOVER A' A autodiscover.zeshu.in
          q 'AUTOCONFIG CNAME' CNAME autoconfig.zeshu.in
          q 'AUTOCONFIG A' A autoconfig.zeshu.in
          q 'MX' MX zeshu.in
          q 'ROOT TXT ALL' TXT zeshu.in
          q 'DMARC TXT' TXT _dmarc.zeshu.in
          q 'CAA' CAA zeshu.in
          q 'HOSTINGERMAIL-A DKIM CNAME' CNAME hostingermail-a._domainkey.zeshu.in
          q 'HOSTINGERMAIL-A DKIM A' A hostingermail-a._domainkey.zeshu.in
          q 'HOSTINGERMAIL-B DKIM CNAME' CNAME hostingermail-b._domainkey.zeshu.in
          q 'HOSTINGERMAIL-B DKIM A' A hostingermail-b._domainkey.zeshu.in
          q 'HOSTINGERMAIL-C DKIM CNAME' CNAME hostingermail-c._domainkey.zeshu.in
          q 'HOSTINGERMAIL-C DKIM A' A hostingermail-c._domainkey.zeshu.in
          q 'HOSTINGERMAIL-A DKIM TXT' TXT hostingermail-a._domainkey.zeshu.in
          q 'HOSTINGERMAIL-B DKIM TXT' TXT hostingermail-b._domainkey.zeshu.in
          q 'HOSTINGERMAIL-C DKIM TXT' TXT hostingermail-c._domainkey.zeshu.in

          echo '=== AUTHORITATIVE NS DIRECT CHECK ==='
          for ns in solar.dns-parking.com lunar.dns-parking.com; do
            echo "--- $ns ---"
            dig +short @"$ns" A zeshu.in || true
            dig +short @"$ns" CNAME www.zeshu.in || true
            dig +short @"$ns" CNAME api.zeshu.in || true
            dig +short @"$ns" MX zeshu.in || true
            dig +short @"$ns" TXT zeshu.in || true
            dig +short @"$ns" TXT _dmarc.zeshu.in || true
            dig +short @"$ns" CNAME hostingermail-a._domainkey.zeshu.in || true
            dig +short @"$ns" CNAME hostingermail-b._domainkey.zeshu.in || true
            dig +short @"$ns" CNAME hostingermail-c._domainkey.zeshu.in || true
            dig +short @"$ns" CNAME autodiscover.zeshu.in || true
            dig +short @"$ns" CNAME autoconfig.zeshu.in || true
          done

          echo '=== HTTPS HEADERS ==='
          curl -IsS --max-time 15 https://zeshu.in | sed -n '1,20p' || true
          curl -IsS --max-time 15 https://www.zeshu.in | sed -n '1,20p' || true
          echo '=== API HTTPS HEADERS ==='
          curl -IsS --max-time 15 https://api.zeshu.in | sed -n '1,25p' || true
