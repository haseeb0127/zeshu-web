name: Android staging test APK

on:
  push:
    branches: [feature/android-test-apk]
    paths:
      - 'android-test/**'
      - '.github/workflows/android-test-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-test/**'
      - '.github/workflows/android-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android-test
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: zeshu-staging-test-apk
          path: android-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
