name: Inspect safe Cloudflare Meta version candidates

on:
  push:
    branches: [main]
    paths: [.github/workflows/meta-safe-version-inspection.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Compare active Worker code fingerprint with ready versions without revealing credentials
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=process.env.CF_ACCOUNT_ID,token=process.env.CF_API_TOKEN;
          if (!account||!token) throw Error('Read-only Cloudflare access not configured.');
          const worker='zeshu-web-production-candidate',key='WHATSAPP_META_TOKEN_ENCRYPTION_KEY';
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+
            '/workers/scripts/'+worker;
          const read=async(path)=>{
            const res=await fetch(base+path,{headers:{Authorization:'Bearer '+token},
              signal:AbortSignal.timeout(15000),redirect:'error'});
            if(!res.ok) throw Error('Cloudflare metadata HTTP '+res.status+' for '+path.split('?')[0]);
            const p=await res.json();if(!p.success)throw Error('Cloudflare metadata API error.');
            return p.result;
          };
          const deps=await read('/deployments');
          const list=Array.isArray(deps)?deps:deps?.deployments;
          if(!Array.isArray(list)||!list.length)throw Error('No deployments to inspect.');
          list.sort((a,b)=>Date.parse(b.created_on||0)-Date.parse(a.created_on||0));
          const active=list[0].versions?.find(v=>v.percentage>=99.99);
          if(!active)throw Error('Active Worker traffic is not 100% on one version.');
          const ver=async id=>await read('/versions/'+encodeURIComponent(id));
          const src=await ver(active.version_id);
          if(!src?.resources?.script?.etag)throw Error('Active bundle fingerprint missing.');
          const currentBindings=src.resources.bindings;
          if(!Array.isArray(currentBindings))throw Error('Active binding array unavailable.');
          const publicShape = binds=>(Array.isArray(binds)?binds:[]).map(b=>b.name+'|'+b.type).sort();
          const currentShape=publicShape(currentBindings);
          const versions=await read('/versions?per_page=30');
          const rows=Array.isArray(versions)?versions:versions?.versions;
          if(!Array.isArray(rows))throw Error('Version list unavailable.');
          const recent=rows.filter(v=>v.id!==active.version_id).slice(0,25);
          const checks=await Promise.all(recent.map(async v=>{
            try{
              const det=await ver(v.id);
              const b=det.resources?.bindings||[];
              const shape=publicShape(b);
              return {id:v.id,created:v.metadata?.created_on??null,
                etagMatches:det.resources?.script?.etag===src.resources.script.etag,
                keyPresent:b.some(x=>x.name===key),
                missingExistingBindings:currentShape.filter(x=>!shape.includes(x)),
                additionalBindings:shape.filter(x=>!currentShape.includes(x)),
                compatibleRuntime:JSON.stringify(det.resources?.script_runtime??{})===
                  JSON.stringify(src.resources?.script_runtime??{}),
                source:v.metadata?.source??null};
            }catch{return {id:v.id,error:'METADATA_READ_FAILED'};}
          }));
          const eligible=checks.filter(x=>x.etagMatches && x.keyPresent &&
            !x.missingExistingBindings?.length && x.compatibleRuntime);
          // Output no binding values, payloads, secrets or script contents; only
          // version identifiers, code match booleans and counts.
          console.log(JSON.stringify({
            worker,
            activeVersion:active.version_id,
            activeCreated:src.metadata?.created_on,
            activeCodeFingerprintPresent:Boolean(src.resources.script.etag),
            activeBindingCount:currentShape.length,
            activeKeyPresent:currentBindings.some(x=>x.name===key),
            checkedVersionCount:checks.length,
            candidatesWithKey:checks.filter(x=>x.keyPresent).length,
            sameCodeCandidates:checks.filter(x=>x.etagMatches).length,
            safelyPromotableCandidates:eligible.map(x=>({
              versionId:x.id,created:x.created,additionalBindingCount:x.additionalBindings.length,
            })),
            recentVersions:checks.slice(0,10).map(x=>({
              id:x.id,etagMatches:!!x.etagMatches,keyPresent:!!x.keyPresent,
              missingExistingBindingsCount:x.missingExistingBindings?.length??null,
              compatibleRuntime:!!x.compatibleRuntime,source:x.source??null,error:x.error??null,
            })),
          },null,2));
          NODE
