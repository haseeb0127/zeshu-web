name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Cloudflare production front door
        shell: bash
        run: |
          set -euo pipefail
          for base in "https://zeshu.in" "https://www.zeshu.in"; do
            headers="$(mktemp)"
            curl -fsS -D "$headers" -o /dev/null "$base/"
            grep -qi '^server: cloudflare' "$headers" || { echo "$base is not fronted by Cloudflare"; exit 1; }
            grep -qi '^x-opennext: 1' "$headers" || { echo "$base is not serving the OpenNext Worker"; exit 1; }
            echo "$base -> Cloudflare OpenNext confirmed"
          done

      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail
          for route in "/" "/policies" "/partners"; do
            code="$(curl -L -sS -o /tmp/zeshu-body -w '%{http_code}' "https://zeshu.in${route}" || true)"
            if [ "$code" != "200" ]; then
              echo "Expected 200 from ${route}, got ${code}"
              exit 1
            fi
          done

      - name: Verify support assistant readiness
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -L -sS "https://zeshu.in/api/support/assistant")"
          echo "Assistant readiness: $body"
          echo "$body" | grep -Eq '"mode":"(ai|guided)"' || { echo "Assistant readiness mode missing"; exit 1; }
          echo "$body" | grep -q '"automatic_handoff":true' || { echo "Automatic support handoff is not configured"; exit 1; }

      - name: Verify protected support APIs reject anonymous requests
        shell: bash
        run: |
          set -euo pipefail

          code="$(curl -L -sS -o /tmp/assistant -w '%{http_code}'             -X POST "https://zeshu.in/api/support/assistant"             -H 'Content-Type: application/json'             --data '{"message":"hello"}' || true)"
          test "$code" = "401" || { echo "Assistant expected 401, got $code"; exit 1; }

          code="$(curl -L -sS -o /tmp/admin-support -w '%{http_code}'             "https://zeshu.in/api/admin/support/conversations" || true)"
          test "$code" = "401" || { echo "Admin support expected 401, got $code"; exit 1; }

          code="$(curl -L -sS -o /tmp/whatsapp-readiness -w '%{http_code}'             "https://zeshu.in/api/admin/support/whatsapp-readiness" || true)"
          test "$code" = "401" || { echo "WhatsApp readiness expected 401, got $code"; exit 1; }

          code="$(curl -L -sS -o /tmp/cron -w '%{http_code}'             "https://zeshu.in/api/cron/support-whatsapp" || true)"
          test "$code" = "401" || { echo "WhatsApp cron expected 401 without bearer token, got $code"; exit 1; }

      - name: Verify API remains outside storefront Worker
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl -sS -D "$headers" -o /dev/null "https://api.zeshu.in/" || true
          grep -qi '^x-vercel-' "$headers" || { echo "api.zeshu.in no longer exposes the expected Vercel origin metadata"; exit 1; }

      - name: Summary
        run: echo "Zeshu Cloudflare production and auth-boundary smoke tests passed."
