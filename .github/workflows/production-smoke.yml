name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production routes
        shell: bash
        run: |
          set -euo pipefail
          for route in "/" "/policies" "/partners"; do
            ok=0
            code=000
            for attempt in {1..12}; do
              code="$(curl -L -sS -o /tmp/zeshu-body -w '%{http_code}' "https://zeshu.in${route}" || true)"
              if [ "$code" = "200" ]; then
                ok=1
                break
              fi
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "Expected 200 from ${route}, got ${code}"
              exit 1
            fi
          done

      - name: Verify protected support APIs reject anonymous requests
        shell: bash
        run: |
          set -euo pipefail

          code="$(curl -sS -o /tmp/assistant -w '%{http_code}' \
            -X POST "https://zeshu.in/api/support/assistant" \
            -H 'Content-Type: application/json' \
            --data '{"message":"hello"}' || true)"
          test "$code" = "401" || { echo "Assistant expected 401, got $code"; exit 1; }

          code="$(curl -sS -o /tmp/admin-support -w '%{http_code}' \
            "https://zeshu.in/api/admin/support/conversations" || true)"
          test "$code" = "401" || { echo "Admin support expected 401, got $code"; exit 1; }

          code="$(curl -sS -o /tmp/cron -w '%{http_code}' \
            "https://zeshu.in/api/cron/support-whatsapp" || true)"
          test "$code" = "401" || { echo "WhatsApp cron expected 401 without bearer token, got $code"; exit 1; }

      - name: Summary
        run: echo "Zeshu production public-route and auth-boundary smoke tests passed."
