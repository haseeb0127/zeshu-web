name: Customer staging browser QA

on:
  workflow_run:
    workflows:
      - Deploy Cloudflare staging
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-browser:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://zeshu-web-staging.asif-mohammed0127.workers.dev
    steps:
      - name: Checkout tested main revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install browser QA dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify mobile storefront search and controls
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 1,
          });

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          try {
            await page.goto(base, { waitUntil: 'networkidle', timeout: 60000 });

            const search = page.locator('input[aria-label="Search Zeshu"]');
            await search.waitFor({ state: 'visible', timeout: 20000 });

            const categories = page.locator('[aria-label="Shop by Category"]');
            await categories.waitFor({ state: 'visible', timeout: 10000 });
            const moveEntry = page.locator('a[href="/move"]').filter({ hasText: 'Move' }).first();
            await moveEntry.waitFor({ state: 'visible', timeout: 10000 });
            assert(await moveEntry.isVisible(), 'Homepage Zeshu Move entry is missing');
            const moveQuick = page.locator('section[aria-labelledby="zeshu-home-hub-title"]');
            await moveQuick.waitFor({ state: 'visible', timeout: 10000 });
            const moveQuickText = (await moveQuick.innerText()).replace(/\s+/g, ' ');
            assert(moveQuickText.includes('Shop. Move. Send. Recharge. One Zeshu.'), 'Homepage business proposition is missing');
            assert(moveQuickText.includes('What do you need today?'), 'Homepage customer decision section is missing');
            assert(moveQuickText.includes('Ride, send or move goods'), 'Homepage Move summary is missing');
            assert(moveQuickText.includes('Where are you going?'), 'Homepage business hub destination action is missing');
            assert(moveQuickText.includes('Jagtial'), 'Homepage business hub must explain Jagtial local coverage');
            assert(moveQuickText.includes('Telangana'), 'Homepage business hub must explain Telangana Move coverage');
            assert(moveQuickText.includes('India'), 'Homepage business hub must explain India digital coverage');
            assert(moveQuickText.includes('Earn with Zeshu'), 'Homepage business hub must expose driver/delivery earning path');
            assert(moveQuickText.includes('Sell on Zeshu'), 'Homepage business hub must expose seller path');
            assert(moveQuickText.includes('Promote with Zeshu'), 'Homepage business hub must expose brand promotion path');
            for (const href of ['/move/request?service=Auto','/move/request?service=Cab','/move/request?service=Bike%20Courier','/move/request?service=Auto%20%2F%20Mini%20Truck']) {
              assert(await moveQuick.locator(`a[href="${href}"]`).count() > 0, `Homepage business hub Move shortcut missing: ${href}`);
            }
            const categoryText = await categories.innerText();
            console.log('Mobile categories:', categoryText.replace(/\s+/g, ' ').trim());
            assert(categoryText.includes('All Products'), 'All Products category is missing');
            assert(categoryText.includes('Drinks & Beverages'), 'Drinks & Beverages category is missing');

            const filters = page.getByRole('button', { name: 'Filters' }).first();
            await filters.waitFor({ state: 'visible', timeout: 10000 });
            assert(await filters.isVisible(), 'Filters button is hidden on mobile');

            const cases = [
              ['cold drink', ['Coca-Cola', 'pepsi']],
              ['doodh', ['milk', 'Amul milk']],
              ['biskut', ['britania marie gold']],
            ];

            for (const [query, expected] of cases) {
              await search.fill(query);
              await page.waitForTimeout(900);
              const text = (await page.locator('body').innerText()).toLowerCase();
              const matched = expected.some((name) => text.includes(name.toLowerCase()));
              console.log(`Search "${query}" -> ${matched ? 'matched' : 'NO MATCH'}`);
              assert(matched, `Search "${query}" did not return an expected product`);
            }

            await search.fill('');
            await page.waitForTimeout(500);
            await page.screenshot({ path: 'mobile-storefront.png', fullPage: true });
            console.log('CUSTOMER_STAGING_BROWSER_QA=PASS');
          } finally {
            await browser.close();
          }
          NODE

      - name: Verify marketplace trust and fulfillment UX
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL;
          const browser = await chromium.launch({ headless: true });
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });

            const sellerResponse = await page.request.get(base + '/api/marketplace/sellers');
            assert(sellerResponse.ok(), 'Marketplace seller API failed');
            const sellerPayload = await sellerResponse.json();
            assert(Array.isArray(sellerPayload.sellers), 'Marketplace seller payload is invalid');
            for (const seller of sellerPayload.sellers) {
              assert(!Object.prototype.hasOwnProperty.call(seller, 'owner_id'), 'Marketplace seller API leaked owner_id');
              assert(!Object.prototype.hasOwnProperty.call(seller, 'seller_quality_score'), 'Marketplace seller API leaked internal seller quality score');
            }

            await page.goto(base, { waitUntil: 'networkidle', timeout: 60000 });
            const body = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            assert(body.includes('Today') || body.includes('10–30 min') || body.includes('2–4 days'), 'Customer delivery promise is missing');

            const search = page.locator('input[aria-label="Search Zeshu"]');
            await search.fill('doodh');
            await page.waitForTimeout(900);
            const searchBody = (await page.locator('body').innerText()).toLowerCase();
            assert(searchBody.includes('milk'), 'Marketplace ranking broke intent-aware search');

            await search.fill('');
            await page.waitForTimeout(500);
            const seeded = await page.evaluate(() => {
              const products = JSON.parse(localStorage.getItem('zeshu_products') || '[]');
              const product = products.find((entry) => entry?.vendor_id && entry?.in_stock !== false && Number(entry?.quantity) > 0);
              if (!product) return false;
              localStorage.setItem('zeshu_customer_cart', JSON.stringify([{ item: product, qty: 1 }]));
              return true;
            });
            assert(seeded, 'Could not seed a safe staging cart from the loaded catalog');

            await page.setViewportSize({ width: 1440, height: 900 });
            await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
            const cartButton = page.locator('button[aria-label^="Open cart"]').first();
            await cartButton.waitFor({ state: 'visible', timeout: 10000 });
            await cartButton.click();

            const cartDialog = page.getByRole('dialog');
            await cartDialog.waitFor({ state: 'visible', timeout: 10000 });
            const cartText = (await cartDialog.innerText()).replace(/\s+/g, ' ');
            assert(
              cartText.includes('Arriving today') || cartText.includes('Arriving in ~10–30 min') || cartText.includes('Shipped delivery · 2–4 days'),
              'Cart fulfillment grouping is missing',
            );

            console.log('MARKETPLACE_STAGING_BROWSER_QA=PASS');
          } finally {
            await browser.close();
          }
          NODE

      - name: Verify Hindi and Urdu storefront localization
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL;
          const browser = await chromium.launch({ headless: true });
          const assert = (value, message) => { if (!value) throw new Error(message); };

          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });

            await page.goto(base, { waitUntil: 'networkidle', timeout: 60000 });
            await page.evaluate(() => localStorage.setItem('zeshu.customer.language', 'hi'));
            await page.reload({ waitUntil: 'networkidle', timeout: 60000 });

            const hindi = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            assert(hindi.includes('खरीदें। चलें। भेजें। रीचार्ज करें। एक Zeshu।'), 'New Zeshu homepage heading is not localized in Hindi');
            assert(hindi.includes('Zeshu कहाँ उपलब्ध है'), 'Homepage coverage heading is not localized in Hindi');
            assert(hindi.includes('किराना और रोज़मर्रा की चीज़ें'), 'Groceries & essentials is not localized in Hindi');
            assert(hindi.includes('राइड्स और कूरियर'), 'Rides & courier is not localized in Hindi');
            assert(hindi.includes('रीचार्ज और बिल'), 'Recharge & bills is not localized in Hindi');
            assert(hindi.includes('मार्केटप्लेस'), 'Marketplace is not localized in Hindi');
            assert(hindi.includes('सभी प्रोडक्ट'), 'All Products heading is not localized in Hindi');
            assert(hindi.includes('आइटम'), 'Product count is not localized in Hindi');
            assert(
              hindi.includes('आज')
              || hindi.includes('10–30 मिनट')
              || hindi.includes('2–4 दिन')
              || hindi.includes('भारत डिलीवरी जल्द')
              || hindi.includes('स्थानीय डिलीवरी'),
              'Delivery promise is not localized in Hindi',
            );
            assert(hindi.includes('अभी कोई समीक्षा नहीं'), 'Review empty state is not localized in Hindi');
            assert(hindi.includes('समीक्षाएँ देखें'), 'Review action is not localized in Hindi');
            assert(hindi.includes('जोड़ें'), 'ADD action is not localized in Hindi');
            assert(hindi.includes('रीचार्ज और बिल'), 'Footer recharge link is not localized in Hindi');
            assert(hindi.includes('आप कहाँ जा रहे हैं?'), 'Homepage Move destination action is not localized in Hindi');
            assert(hindi.includes('Zeshu पर बेचें'), 'Seller path is not localized in Hindi');
            assert(hindi.includes('Zeshu के साथ प्रचार करें'), 'Brand promotion path is not localized in Hindi');

            for (const english of ['All Items', 'No reviews yet', 'See reviews', 'Image unavailable']) {
              assert(!hindi.includes(english), `English storefront label still visible in Hindi: ${english}`);
            }

            await page.evaluate(() => localStorage.setItem('zeshu.customer.language', 'ur'));
            await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dir === 'rtl', null, { timeout: 10000 });

            const urdu = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            assert(await page.locator('html').getAttribute('dir') === 'rtl', 'Urdu page is not RTL');
            assert(urdu.includes('خریدیں۔ سفر کریں۔ بھیجیں۔ ریچارج کریں۔ ایک Zeshu۔'), 'New Zeshu homepage heading is not localized in Urdu');
            assert(urdu.includes('Zeshu کہاں دستیاب ہے'), 'Homepage coverage heading is not localized in Urdu');
            assert(urdu.includes('گروسری اور روزمرہ ضروریات'), 'Groceries & essentials is not localized in Urdu');
            assert(urdu.includes('رائیڈز اور کورئیر'), 'Rides & courier is not localized in Urdu');
            assert(urdu.includes('ریچارج اور بلز'), 'Recharge & bills is not localized in Urdu');
            assert(urdu.includes('مارکیٹ پلیس'), 'Marketplace is not localized in Urdu');
            assert(urdu.includes('آپ کہاں جا رہے ہیں؟'), 'Homepage Move destination action is not localized in Urdu');
            assert(urdu.includes('Zeshu پر فروخت کریں'), 'Seller path is not localized in Urdu');
            assert(urdu.includes('Zeshu کے ساتھ تشہیر کریں'), 'Brand promotion path is not localized in Urdu');

            await page.screenshot({ path: 'localized-storefront-urdu.png', fullPage: true });
            console.log('LANGUAGE_HYBRID_BROWSER_QA=PASS');
          } finally {
            await browser.close();
          }
          NODE

      - name: Verify public Help Center, AI boundaries and localization
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL;
          const browser = await chromium.launch({ headless: true });
          const assert = (value, message) => { if (!value) throw new Error(message); };

          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto(base + '/help', { waitUntil: 'networkidle', timeout: 60000 });

            const heading = page.getByRole('heading', { name: 'Zeshu Help Center' });
            await heading.waitFor({ state: 'visible', timeout: 10000 });

            const helpText = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            for (const topic of ['Shopping & Orders','Marketplace','Delivery & Address','Rides','Courier & Cargo','Car Share','Travel','Pharmacy & Health','Recharge & Bills','Zeshu Cash & Referrals','Payments & Refunds','Account & Safety']) {
              assert(helpText.includes(topic), `Help Center topic missing: ${topic}`);
            }
            assert(helpText.includes('Need a person?'), 'Human support CTA is missing from Help Center');
            assert(helpText.includes('Current service status'), 'Help Center service-status panel is missing');
            assert(helpText.includes('Shopping & Orders') && helpText.includes('Available now'), 'Live shopping status is missing');
            assert(helpText.includes('Recharge & Bills') && helpText.includes('Discovery available'), 'Digital discovery status is missing');
            assert(helpText.includes('Rides') && helpText.includes('Coming soon'), 'Move status is missing');

            const input = page.locator('input[placeholder="Ask anything about Zeshu…"]');
            await input.fill('Can I book a bike ride now?');
            await page.getByRole('button', { name: 'Send', exact: true }).click();

            await page.waitForFunction(() => {
              const text = document.body.innerText;
              return text.includes('Coming Soon') && text.includes('booking') && text.includes('payment');
            }, null, { timeout: 20000 });

            const publicText = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            assert(publicText.includes('Coming Soon'), 'Public Help Center did not return safe ride availability');
            assert(publicText.includes('Ride issue'), 'Ride question did not receive the Ride issue support category');
            assert(!publicText.includes('Order #'), 'Guest Help Center exposed private order context');

            const guidedCases = [
              ['How much is the delivery fee?', 'does not promise one universal delivery or shipping fee'],
              ['What does GST Verified seller mean?', 'seller trust labels separate'],
              ['Is WhatsApp support available?', 'not treated as live'],
              ['What is Zeshu Market?', 'asset-light marketplace'],
              ['How does Zeshu protect my data?', 'Privacy Policy'],
            ];

            for (const [question, expected] of guidedCases) {
              await input.fill(question);
              await page.getByRole('button', { name: 'Send', exact: true }).click();
              await page.waitForFunction((needle) => document.body.innerText.toLowerCase().includes(String(needle).toLowerCase()), expected, { timeout: 20000 });
            }

            const move = await page.request.get(base + '/api/move/readiness');
            assert(move.ok(), 'Move readiness API failed');
            const readiness = await move.json();
            assert(readiness.customer_booking_enabled === false, 'Move & Travel unexpectedly became bookable');
            for (const key of ['rides','courier','car_share','travel']) {
              assert(readiness?.services?.[key]?.customerBookingAvailable === false, `${key} unexpectedly became bookable`);
            }

            await page.evaluate(() => localStorage.setItem('zeshu.customer.language', 'hi'));
            await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
            const hindi = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            assert(hindi.includes('Zeshu हेल्प सेंटर'), 'Help Center heading is not localized in Hindi');
            assert(hindi.includes('राइड्स'), 'Help Center rides topic is not localized in Hindi');
            assert(hindi.includes('डिलीवरी और पता'), 'Delivery & Address is not localized in Hindi');
            assert(hindi.includes('फार्मेसी और हेल्थ'), 'Pharmacy & Health is not localized in Hindi');
            assert(hindi.includes('Zeshu कैश और रेफरल'), 'Zeshu Cash & Referrals is not localized in Hindi');

            await page.evaluate(() => localStorage.setItem('zeshu.customer.language', 'ur'));
            await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dir === 'rtl', null, { timeout: 10000 });
            const urdu = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            assert(urdu.includes('Zeshu ہیلپ سینٹر'), 'Help Center heading is not localized in Urdu');
            assert(urdu.includes('رائیڈز'), 'Help Center rides topic is not localized in Urdu');
            assert(urdu.includes('ڈیلیوری اور پتہ'), 'Delivery & Address is not localized in Urdu');
            assert(urdu.includes('فارمیسی اور ہیلتھ'), 'Pharmacy & Health is not localized in Urdu');
            assert(urdu.includes('Zeshu کیش اور ریفرلز'), 'Zeshu Cash & Referrals is not localized in Urdu');
            assert(await page.locator('html').getAttribute('dir') === 'rtl', 'Urdu Help Center is not RTL');

            await page.screenshot({ path: 'help-center-urdu.png', fullPage: true });
            console.log('HELP_CENTER_BROWSER_QA=PASS');
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload Help Center QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: customer-staging-help-center-qa
          path: help-center-urdu.png
          retention-days: 7

      - name: Upload mobile QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: customer-staging-mobile-qa
          path: mobile-storefront.png
          retention-days: 7
      - name: Upload localized QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: customer-staging-localized-qa
          path: localized-storefront-urdu.png
          retention-days: 7
