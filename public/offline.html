<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e45"><meta name="robots" content="noindex">
<title>Reconnect to Zeshu</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;background:radial-gradient(ellipse at top,#effdf4,#fff 57%,#f5faf7);font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;color:#123029;padding:24px}
.card{width:min(100%,420px);padding:32px 24px;border-radius:28px;background:white;box-shadow:0 12px 40px #075e451c;border:1px solid #def0e4;text-align:center}.icon{display:grid;place-items:center;background:linear-gradient(145deg,#24c486,#00623e);color:#fff;border-radius:24px;width:76px;height:76px;font-size:48px;font-weight:900;margin:0 auto 22px;box-shadow:0 12px 20px #075e4530}
h1{font-size:25px;line-height:1.2;margin:0 0 12px}p{color:#587065;font-size:15px;line-height:1.6;margin:0 0 24px}.actions{display:grid;gap:12px}a,button{display:block;width:100%;padding:15px 16px;text-decoration:none;font:700 15px system-ui;border-radius:16px;cursor:pointer}button{border:0;color:#fff;background:#075e45}a{border:1px solid #d4e9db;color:#075e45;background:#f5fbf7}.note{font-size:12px;margin-top:22px;color:#64766b}
</style>
</head>
<body><main class="card"><div class="icon" aria-hidden="true">Z</div><h1>We couldn't connect to Zeshu</h1><p>Please check your internet connection and try again. Your order or payment status has not been changed by this screen.</p><div class="actions"><button type="button" onclick="location.reload()">Try again</button><a href="/">Go to Zeshu Home</a></div><div class="note">If the problem continues, open zeshu.in in Chrome or visit the Help Center when online.</div></main></body>
</html>
